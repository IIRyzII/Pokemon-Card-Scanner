# Deploys the PokéVault API (Cloudflare Worker + D1 database) whenever api/ changes.
# Needs two repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   CLOUDFLARE_API_TOKEN   — token with the "Edit Cloudflare Workers" template + D1 edit permission
#   CLOUDFLARE_ACCOUNT_ID  — shown in the Cloudflare dashboard sidebar
# and the real database_id filled in api/wrangler.jsonc. Without the secrets this workflow skips itself.
name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'shared/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Skipping API deploy — add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - name: Type-check
        if: steps.secrets.outputs.ready == 'true'
        run: npm run typecheck --workspace api
      - name: Apply database migrations
        if: steps.secrets.outputs.ready == 'true'
        working-directory: api
        run: npx wrangler d1 migrations apply pokevault --remote
      - name: Deploy worker
        if: steps.secrets.outputs.ready == 'true'
        working-directory: api
        run: npx wrangler deploy
